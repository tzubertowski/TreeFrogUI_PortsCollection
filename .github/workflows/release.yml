name: Publish ports

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-ports
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update README
        run: python3 tools/update_readme.py

      - name: Commit README if changed
        run: |
          # Safety: the script must only touch README.md
          others=$(git status --porcelain | grep -v ' README.md$' || true)
          if [ -n "$others" ]; then
            echo "Unexpected changes besides README.md:"
            echo "$others"
            exit 1
          fi

          if git diff --quiet -- README.md; then
            echo "README.md already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README"
          git push origin HEAD:${{ github.ref_name }}
      - run: pip install -r requirements.txt
      - run: python3 tools/validate_ports.py
      - run: python3 tools/build_release.py
      - name: Generate release notes with port attribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ports-${{ github.run_number }}
          RELEASE_NOTES_PATH: dist/release-notes.md
        run: python3 tools/generate_release_notes.py
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ports-${{ github.run_number }}
          name: Ports collection ${{ github.run_number }}
          make_latest: true
          body_path: dist/release-notes.md
          files: |
            dist/TreeFrogUI-Ports-standalone.zip
            dist/TreeFrogUI-Ports-requiring-game-data.zip

      - name: Post stable release to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STABLE_RELEASE_WEBHOOK }}
          RELEASE_TAG: ports-${{ github.run_number }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          release_name=$(jq -r '.name // .tag_name' <<<"$release")
          release_url=$(jq -r '.html_url' <<<"$release")
          release_body=$(jq -r '.body // ""' <<<"$release")
          payload=$(jq -n \
            --arg title "${GITHUB_REPOSITORY##*/} $release_name released" \
            --arg url "$release_url" \
            --arg body "$release_body" \
            '{embeds:[{title:$title,url:$url,description:($body[0:4000]),color:3066993,footer:{text:"Stable release"}}]}')
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
