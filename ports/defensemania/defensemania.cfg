# Picture tuning for Defense Mania on the Data Frog SF3500. Edit, save, relaunch the game.
# The colours are worked out once, while a map loads, so this costs nothing while playing.
#
# brightness  -100 .. 100   0 = unchanged   (higher = lighter)
# contrast     0 .. 200     100 = unchanged (higher = darker darks, brighter lights)
# saturation   0 .. 200     100 = unchanged (higher = stronger colours, 0 = grey)
# gamma        0.5 .. 2.5   1.0 = unchanged (higher = lighter midtones, lower = deeper midtones)
#
# A value can be set for one map by putting its name in front:
#   mountains_  maze_  woods_  river_side_  swamp_  tundra_  bigger_  coast_
# for example "woods_saturation = 130" changes only Dark Woods.
brightness = 0
contrast = 112
saturation = 115
gamma = 1.0
woods_contrast = 120
woods_saturation = 125

# The first three lines below are also in Options on the title screen: 1 = on
show_fps = 0
hq_graphics = 0

# Volumes, 0..100, also in Options. Music: a random track from music/<folder of the map>, then another when it ends.
master_volume = 80
music_volume = 60
sfx_volume = 80

# ---- Game balance. The defaults are what the game was tuned for; change them if you want an easier or a harder game. ----
#
# Gold: what a kill pays is the creature's money value times (1 + gold_difficulty_step per difficulty above Easy) times
# (1 + gold_wave_growth x how far into the match the wave is, 0 for the first wave, the full value for the last). Hard has three times
# the health of Easy and the late waves are far tougher than the early ones, so the reward grows with both. Fractions are carried over,
# so small rewards add up. The score counts the plain money value and is not affected.
gold_difficulty_step = 0.10
gold_wave_growth = 0.8

# Creatures that attack towers: they do this share of their listed damage on each difficulty (Easy is gentle), and no tower loses more than
# this percent of its full health per second to creatures, however many pass by. Boulders thrown at towers use the same share.
tower_damage_easy = 0.5
tower_damage_normal = 0.75
tower_damage_hard = 1.0
tower_damage_cap_easy = 6
tower_damage_cap_normal = 10
tower_damage_cap_hard = 15

# Endless mode (a map's Endless mode opens when you have played all three of its difficulties perfectly: every wave cleared and no life lost). Each wave the creatures grow
# tougher by these amounts (0.07 = 7% more health per wave, compounding). The gold per kill grows too, but slower.
endless_hp_growth = 0.07
endless_speed_growth = 0.008
endless_count_growth = 0.03
endless_money_growth = 0.05
endless_damage_growth = 0.04
# Endless supply drops: every endless_bonus_every waves the player is paid endless_bonus_gold gold, growing by endless_bonus_growth
# (a share of the base) with each drop and by the difficulty step; 0 for endless_bonus_every turns it off.
endless_bonus_every = 5
endless_bonus_gold = 120
endless_bonus_growth = 0.15

# Soldiers from the Bastion: the most health a soldier can lose in one second to attacking creatures, as a percent of its full health.
soldier_damage_cap = 10
# A soldier standing in a Resupply Depot's area mends this share of what the depot mends for a tower (1 = the same, 0 = not at all).
soldier_heal_share = 0.5

# Frame rate: the game never sends more than fps_cap frames a second (0 = no limit). 30 keeps the picture and the sound
# steady on the SF3500, whose display driver runs at its own pace; most maps would otherwise hover around 35-40.
fps_cap = 30

# Shortcuts, for anyone who would rather not earn them (1 = on):
# unlock_all_difficulties opens Normal and Hard on every map, and The Coast, without winning anything first;
# endless_unlocked opens Endless mode on every map at once.
unlock_all_difficulties = 0
endless_unlocked = 0
