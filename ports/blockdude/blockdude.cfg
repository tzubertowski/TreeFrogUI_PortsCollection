# Picture tuning for Blockdude on the Data Frog SF3500. Edit, save, relaunch the game.
# Leave a value out to keep its default.
#
# brightness  -100 .. 100   0 = unchanged   (higher = lighter)
# contrast     0 .. 200     100 = unchanged (higher = darker darks, brighter lights)
# saturation   0 .. 200     100 = unchanged (higher = stronger colours, 0 = grey)
# gamma        0.5 .. 2.5   1.0 = unchanged (higher = lighter midtones, lower = deeper midtones)
#
# Defaults below are the "less washed out" setting; use 100 / 100 / 1.0 for the unmodified look.
brightness = 0
contrast = 120
saturation = 120
gamma = 0.9

# Text sizes. The fonts shipped with the port are open ones (DejaVu). If you prefer the original
# game's fonts, get them yourself (Verdana, IrisUPC, Monofonto), copy them over font.ttf, font2.ttf
# and font1.ttf in blockdudefs/fonts/, and set the sizes to 9, 16, 20 and 17.
font_small = 10
font_skin = 16
font_big = 11
font_mono = 15
